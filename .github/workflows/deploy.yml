name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bygg alle prosjektene
        run: |
          mkdir -p site
          for dir in static_page/*/ data_driven/*/; do
            dir=${dir%/}
            p=$(basename "$dir")
            echo "=== Bygger $p ==="
            (
              cd "$dir"
              npm ci
              npm run build -- --base=/practice_react/$p/
            )
            cp -r "$dir/dist" "site/$p"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4